<style>
    body {

    ul {

    ul li {

    ul li a {

        }

        }

            background-color: rgb(247, 58, 58);

            font-size: 15px;
        }

        .dropbtn {
            background-color: rgb(247, 58, 58);
            color: white;
            font-size: 15px;
            border-radius: 10px;
            padding: 5px;
            margin: 0 auto;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: rgb(247, 58, 58);
        }

</style>
